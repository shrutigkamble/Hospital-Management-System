<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Doctor - HMS</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>


<body class="bg-light">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">

        <div class="container-fluid">

            <a
                href="{{ url_for('dashboard') }}"
                class="navbar-brand fw-bold"
            >
                Hospital Management System
            </a>


            <div class="d-flex align-items-center">

                <span class="text-white me-3">
                    Welcome, {{ current_user.username }}
                </span>

                <a
                    href="{{ url_for('logout') }}"
                    class="btn btn-light btn-sm"
                >
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="container mt-4 mb-5">

        <!-- Page Header -->
        <div
            class="d-flex justify-content-between align-items-center mb-4"
        >

            <div>

                <h2 class="fw-bold mb-1">
                    Edit Doctor
                </h2>

                <p class="text-muted mb-0">
                    Update doctor professional and contact information
                </p>

            </div>


            <a
                href="{{ url_for('doctor.doctor_details', doctor_id=doctor.id) }}"
                class="btn btn-secondary"
            >
                Back to Doctor Details
            </a>

        </div>


        <!-- ==================== DOCTOR FORM ==================== -->
        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">
                    Doctor Information
                </h5>

            </div>


            <div class="card-body p-4">

                <form
                    method="POST"
                    action="{{ url_for('doctor.edit_doctor', doctor_id=doctor.id) }}"
                >

                    <!-- Doctor ID -->
                    <div class="alert alert-info">

                        <strong>Doctor ID:</strong>
                        {{ doctor.id }}

                    </div>


                    <!-- ==================== BASIC INFORMATION ==================== -->

                    <h5 class="mb-3">
                        Basic Information
                    </h5>


                    <div class="row">

                        <!-- Doctor Name -->
                        <div class="col-md-6 mb-3">

                            <label
                                for="name"
                                class="form-label"
                            >
                                Doctor Name *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                value="{{ doctor.name }}"
                                required
                            >

                        </div>


                        <!-- Specialization -->
                        <div class="col-md-6 mb-3">

                            <label
                                for="specialization"
                                class="form-label"
                            >
                                Specialization *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="specialization"
                                name="specialization"
                                value="{{ doctor.specialization }}"
                                required
                            >

                        </div>

                    </div>


                    <!-- ==================== CONTACT INFORMATION ==================== -->

                    <h5 class="mt-3 mb-3">
                        Contact Information
                    </h5>


                    <div class="row">

                        <!-- Phone -->
                        <div class="col-md-6 mb-3">

                            <label
                                for="phone"
                                class="form-label"
                            >
                                Phone Number *
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                name="phone"
                                value="{{ doctor.phone }}"
                                required
                            >

                        </div>


                        <!-- Email -->
                        <div class="col-md-6 mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                value="{{ doctor.email or '' }}"
                            >

                        </div>

                    </div>


                    <!-- ==================== PROFESSIONAL INFORMATION ==================== -->

                    <h5 class="mt-3 mb-3">
                        Professional Information
                    </h5>


                    <div class="row">

                        <!-- Consultation Fee -->
                        <div class="col-md-4 mb-3">

                            <label
                                for="consultation_fee"
                                class="form-label"
                            >
                                Consultation Fee *
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    ₹
                                </span>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="consultation_fee"
                                    name="consultation_fee"
                                    min="0"
                                    step="0.01"
                                    value="{{ doctor.consultation_fee or 0 }}"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Availability -->
                        <div class="col-md-8 mb-3">

                            <label
                                for="availability"
                                class="form-label"
                            >
                                Availability / Schedule
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="availability"
                                name="availability"
                                value="{{ doctor.availability or '' }}"
                                placeholder="e.g. Monday - Friday, 10:00 AM - 2:00 PM"
                            >

                        </div>

                    </div>


                    <!-- ==================== BUTTONS ==================== -->

                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Update Doctor
                        </button>


                        <a
                            href="{{ url_for('doctor.doctor_details', doctor_id=doctor.id) }}"
                            class="btn btn-secondary ms-2"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
