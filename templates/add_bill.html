<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Bill - HMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>


<body class="bg-light">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">

        <div class="container-fluid">

            <a
                href="{{ url_for('dashboard') }}"
                class="navbar-brand fw-bold"
            >
                Hospital Management System
            </a>


            <div class="d-flex align-items-center">

                <span class="text-white me-3">
                    Welcome, {{ current_user.username }}
                </span>

                <a
                    href="{{ url_for('logout') }}"
                    class="btn btn-light btn-sm"
                >
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="container mt-4 mb-5">

        <div class="mb-4">

            <h2 class="fw-bold mb-1">
                Create New Bill
            </h2>

            <p class="text-muted mb-0">
                Add consultation, laboratory, pharmacy and other charges.
            </p>

        </div>


        <!-- ==================== BILL FORM ==================== -->
        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">
                    Bill Information
                </h5>

            </div>


            <div class="card-body">

                <form
                    method="POST"
                    action="{{ url_for('billing.add_bill') }}"
                >

                    <div class="row g-3">


                        <!-- Patient -->
                        <div class="col-md-6">

                            <label
                                for="patient_id"
                                class="form-label fw-semibold"
                            >
                                Patient
                            </label>

                            <select
                                name="patient_id"
                                id="patient_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    -- Select Patient --
                                </option>

                                {% for patient in patients %}

                                    <option value="{{ patient.id }}">

                                        {{ patient.patient_code }}
                                        - {{ patient.name }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Bill Date -->
                        <div class="col-md-6">

                            <label
                                for="bill_date"
                                class="form-label fw-semibold"
                            >
                                Bill Date
                            </label>

                            <input
                                type="date"
                                name="bill_date"
                                id="bill_date"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- Consultation Charge -->
                        <div class="col-md-6">

                            <label
                                for="consultation_charge"
                                class="form-label fw-semibold"
                            >
                                Consultation Charge (₹)
                            </label>

                            <input
                                type="number"
                                name="consultation_charge"
                                id="consultation_charge"
                                class="form-control charge-input"
                                value="0"
                                min="0"
                                step="0.01"
                            >

                        </div>


                        <!-- Laboratory Charge -->
                        <div class="col-md-6">

                            <label
                                for="laboratory_charge"
                                class="form-label fw-semibold"
                            >
                                Laboratory Charge (₹)
                            </label>

                            <input
                                type="number"
                                name="laboratory_charge"
                                id="laboratory_charge"
                                class="form-control charge-input"
                                value="0"
                                min="0"
                                step="0.01"
                            >

                        </div>


                        <!-- Pharmacy Charge -->
                        <div class="col-md-6">

                            <label
                                for="pharmacy_charge"
                                class="form-label fw-semibold"
                            >
                                Pharmacy Charge (₹)
                            </label>

                            <input
                                type="number"
                                name="pharmacy_charge"
                                id="pharmacy_charge"
                                class="form-control charge-input"
                                value="0"
                                min="0"
                                step="0.01"
                            >

                        </div>


                        <!-- Room Charge -->
                        <div class="col-md-6">

                            <label
                                for="room_charge"
                                class="form-label fw-semibold"
                            >
                                Room Charge (₹)
                            </label>

                            <input
                                type="number"
                                name="room_charge"
                                id="room_charge"
                                class="form-control charge-input"
                                value="0"
                                min="0"
                                step="0.01"
                            >

                        </div>


                        <!-- Other Charge -->
                        <div class="col-md-6">

                            <label
                                for="other_charge"
                                class="form-label fw-semibold"
                            >
                                Other Charge (₹)
                            </label>

                            <input
                                type="number"
                                name="other_charge"
                                id="other_charge"
                                class="form-control charge-input"
                                value="0"
                                min="0"
                                step="0.01"
                            >

                        </div>


                        <!-- Total -->
                        <div class="col-md-6">

                            <label
                                for="total_amount"
                                class="form-label fw-semibold"
                            >
                                Total Amount (₹)
                            </label>

                            <input
                                type="text"
                                id="total_amount"
                                class="form-control fw-bold"
                                value="0.00"
                                readonly
                            >

                        </div>


                        <!-- Payment Status -->
                        <div class="col-md-6">

                            <label
                                for="payment_status"
                                class="form-label fw-semibold"
                            >
                                Payment Status
                            </label>

                            <select
                                name="payment_status"
                                id="payment_status"
                                class="form-select"
                            >

                                <option value="Pending">
                                    Pending
                                </option>

                                <option value="Partial">
                                    Partial
                                </option>

                                <option value="Paid">
                                    Paid
                                </option>

                                <option value="Cancelled">
                                    Cancelled
                                </option>

                            </select>

                        </div>


                        <!-- Payment Method -->
                        <div class="col-md-6">

                            <label
                                for="payment_method"
                                class="form-label fw-semibold"
                            >
                                Payment Method
                            </label>

                            <select
                                name="payment_method"
                                id="payment_method"
                                class="form-select"
                            >

                                <option value="">
                                    -- Select Payment Method --
                                </option>

                                <option value="Cash">
                                    Cash
                                </option>

                                <option value="Card">
                                    Card
                                </option>

                                <option value="UPI">
                                    UPI
                                </option>

                                <option value="Bank Transfer">
                                    Bank Transfer
                                </option>

                            </select>

                        </div>


                        <!-- Notes -->
                        <div class="col-12">

                            <label
                                for="notes"
                                class="form-label fw-semibold"
                            >
                                Notes
                            </label>

                            <textarea
                                name="notes"
                                id="notes"
                                class="form-control"
                                rows="3"
                                placeholder="Enter additional billing notes..."
                            ></textarea>

                        </div>


                        <!-- Buttons -->
                        <div class="col-12 mt-4">

                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Create Bill
                                </button>

                                <a
                                    href="{{ url_for('billing.billing_list') }}"
                                    class="btn btn-secondary"
                                >
                                    Cancel
                                </a>

                            </div>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- ==================== JAVASCRIPT ==================== -->
    <script>

        const chargeInputs = document.querySelectorAll(
            ".charge-input"
        );

        const totalAmount = document.getElementById(
            "total_amount"
        );


        function calculateTotal() {

            let total = 0;

            chargeInputs.forEach(function(input) {

                total += parseFloat(input.value) || 0;

            });

            totalAmount.value = total.toFixed(2);

        }


        chargeInputs.forEach(function(input) {

            input.addEventListener(
                "input",
                calculateTotal
            );

        });


        calculateTotal();

    </script>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
