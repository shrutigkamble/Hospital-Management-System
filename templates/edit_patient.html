<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Patient - HMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">

            <a
                href="{{ url_for('dashboard') }}"
                class="navbar-brand"
            >
                Hospital Management System
            </a>

            <div class="d-flex align-items-center">

                <span class="text-white me-3">
                    Welcome, {{ current_user.username }}
                </span>

                <a
                    href="{{ url_for('logout') }}"
                    class="btn btn-light btn-sm"
                >
                    Logout
                </a>

            </div>

        </div>
    </nav>


    <!-- Main Content -->
    <div class="container mt-4 mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>
                Edit Patient
            </h2>

            <a
                href="{{ url_for('patient.patient_details', patient_id=patient.id) }}"
                class="btn btn-secondary"
            >
                Back to Patient Details
            </a>

        </div>


        <!-- Patient Information -->
        <div class="card shadow-sm">

            <div class="card-body p-4">

                <form
                    method="POST"
                    action="{{ url_for('patient.edit_patient', patient_id=patient.id) }}"
                >

                    <!-- Patient ID Information -->
                    <div class="alert alert-info">

                        <strong>Patient Code:</strong>
                        {{ patient.patient_code }}

                        &nbsp;&nbsp;

                        <strong>Patient ID:</strong>
                        {{ patient.id }}

                    </div>


                    <!-- Basic Information -->
                    <h5 class="mb-3">
                        Basic Information
                    </h5>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="name" class="form-label">
                                Patient Name *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                value="{{ patient.name }}"
                                required
                            >

                        </div>


                        <div class="col-md-3 mb-3">

                            <label for="age" class="form-label">
                                Age *
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="age"
                                name="age"
                                min="0"
                                max="150"
                                value="{{ patient.age }}"
                                required
                            >

                        </div>


                        <div class="col-md-3 mb-3">

                            <label for="gender" class="form-label">
                                Gender *
                            </label>

                            <select
                                class="form-select"
                                id="gender"
                                name="gender"
                                required
                            >

                                <option value="">
                                    Select Gender
                                </option>

                                <option
                                    value="Male"
                                    {% if patient.gender == "Male" %}selected{% endif %}
                                >
                                    Male
                                </option>

                                <option
                                    value="Female"
                                    {% if patient.gender == "Female" %}selected{% endif %}
                                >
                                    Female
                                </option>

                                <option
                                    value="Other"
                                    {% if patient.gender == "Other" %}selected{% endif %}
                                >
                                    Other
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- Contact Information -->
                    <h5 class="mt-3 mb-3">
                        Contact Information
                    </h5>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="phone" class="form-label">
                                Phone Number *
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                name="phone"
                                value="{{ patient.phone }}"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                value="{{ patient.email or '' }}"
                            >

                        </div>


                        <div class="col-12 mb-3">

                            <label for="address" class="form-label">
                                Address
                            </label>

                            <textarea
                                class="form-control"
                                id="address"
                                name="address"
                                rows="3"
                            >{{ patient.address or '' }}</textarea>

                        </div>

                    </div>


                    <!-- Medical Information -->
                    <h5 class="mt-3 mb-3">
                        Medical Information
                    </h5>

                    <div class="row">

                        <div class="col-md-4 mb-3">

                            <label for="blood_group" class="form-label">
                                Blood Group
                            </label>

                            <select
                                class="form-select"
                                id="blood_group"
                                name="blood_group"
                            >

                                <option value="">
                                    Select Blood Group
                                </option>

                                <option value="A+" {% if patient.blood_group == "A+" %}selected{% endif %}>
                                    A+
                                </option>

                                <option value="A-" {% if patient.blood_group == "A-" %}selected{% endif %}>
                                    A-
                                </option>

                                <option value="B+" {% if patient.blood_group == "B+" %}selected{% endif %}>
                                    B+
                                </option>

                                <option value="B-" {% if patient.blood_group == "B-" %}selected{% endif %}>
                                    B-
                                </option>

                                <option value="AB+" {% if patient.blood_group == "AB+" %}selected{% endif %}>
                                    AB+
                                </option>

                                <option value="AB-" {% if patient.blood_group == "AB-" %}selected{% endif %}>
                                    AB-
                                </option>

                                <option value="O+" {% if patient.blood_group == "O+" %}selected{% endif %}>
                                    O+
                                </option>

                                <option value="O-" {% if patient.blood_group == "O-" %}selected{% endif %}>
                                    O-
                                </option>

                            </select>

                        </div>


                        <div class="col-md-8 mb-3">

                            <label for="allergies" class="form-label">
                                Allergies
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="allergies"
                                name="allergies"
                                value="{{ patient.allergies or '' }}"
                            >

                        </div>


                        <div class="col-12 mb-3">

                            <label for="medical_history" class="form-label">
                                Medical History
                            </label>

                            <textarea
                                class="form-control"
                                id="medical_history"
                                name="medical_history"
                                rows="4"
                            >{{ patient.medical_history or '' }}</textarea>

                        </div>

                    </div>


                    <!-- Buttons -->
                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Update Patient
                        </button>

                        <a
                            href="{{ url_for('patient.patient_details', patient_id=patient.id) }}"
                            class="btn btn-secondary ms-2"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
