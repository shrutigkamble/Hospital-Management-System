<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Appointment - HMS</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>


<body class="bg-light">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">

        <div class="container-fluid">

            <a
                href="{{ url_for('dashboard') }}"
                class="navbar-brand fw-bold"
            >
                Hospital Management System
            </a>


            <div class="d-flex align-items-center">

                <span class="text-white me-3">
                    Welcome, {{ current_user.username }}
                </span>

                <a
                    href="{{ url_for('logout') }}"
                    class="btn btn-light btn-sm"
                >
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="container mt-4 mb-5">

        <!-- Page Header -->
        <div class="mb-4">

            <h2 class="fw-bold mb-1">
                Edit Appointment
            </h2>

            <p class="text-muted mb-0">
                Update appointment information
            </p>

        </div>


        <!-- ==================== EDIT FORM ==================== -->
        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">
                    Appointment Information
                </h5>

            </div>


            <div class="card-body">

                <form
                    method="POST"
                    action="{{ url_for('appointment.edit_appointment', appointment_id=appointment.id) }}"
                >

                    <div class="row g-3">


                        <!-- ==================== PATIENT ==================== -->
                        <div class="col-md-6">

                            <label
                                for="patient_id"
                                class="form-label fw-semibold"
                            >
                                Patient
                            </label>

                            <select
                                name="patient_id"
                                id="patient_id"
                                class="form-select"
                                required
                            >

                                {% for patient_item in patients %}

                                    <option
                                        value="{{ patient_item.id }}"
                                        {% if patient_item.id == appointment.patient_id %}selected{% endif %}
                                    >

                                        {{ patient_item.patient_code }}
                                        - {{ patient_item.name }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- ==================== DOCTOR ==================== -->
                        <div class="col-md-6">

                            <label
                                for="doctor_id"
                                class="form-label fw-semibold"
                            >
                                Doctor
                            </label>

                            <select
                                name="doctor_id"
                                id="doctor_id"
                                class="form-select"
                                required
                            >

                                {% for doctor_item in doctors %}

                                    <option
                                        value="{{ doctor_item.id }}"
                                        {% if doctor_item.id == appointment.doctor_id %}selected{% endif %}
                                    >

                                        Dr. {{ doctor_item.name }}
                                        - {{ doctor_item.specialization }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- ==================== DATE ==================== -->
                        <div class="col-md-6">

                            <label
                                for="appointment_date"
                                class="form-label fw-semibold"
                            >
                                Appointment Date
                            </label>

                            <input
                                type="date"
                                name="appointment_date"
                                id="appointment_date"
                                class="form-control"
                                value="{{ appointment.appointment_date.strftime('%Y-%m-%d') }}"
                                required
                            >

                        </div>


                        <!-- ==================== TIME ==================== -->
                        <div class="col-md-6">

                            <label
                                for="appointment_time"
                                class="form-label fw-semibold"
                            >
                                Appointment Time
                            </label>

                            <input
                                type="time"
                                name="appointment_time"
                                id="appointment_time"
                                class="form-control"
                                value="{{ appointment.appointment_time.strftime('%H:%M') }}"
                                required
                            >

                        </div>


                        <!-- ==================== STATUS ==================== -->
                        <div class="col-md-6">

                            <label
                                for="status"
                                class="form-label fw-semibold"
                            >
                                Appointment Status
                            </label>

                            <select
                                name="status"
                                id="status"
                                class="form-select"
                                required
                            >

                                <option
                                    value="Scheduled"
                                    {% if appointment.status == "Scheduled" %}selected{% endif %}
                                >
                                    Scheduled
                                </option>

                                <option
                                    value="Completed"
                                    {% if appointment.status == "Completed" %}selected{% endif %}
                                >
                                    Completed
                                </option>

                                <option
                                    value="Cancelled"
                                    {% if appointment.status == "Cancelled" %}selected{% endif %}
                                >
                                    Cancelled
                                </option>

                            </select>

                        </div>


                        <!-- ==================== REASON ==================== -->
                        <div class="col-12">

                            <label
                                for="reason"
                                class="form-label fw-semibold"
                            >
                                Reason / Symptoms
                            </label>

                            <textarea
                                name="reason"
                                id="reason"
                                class="form-control"
                                rows="4"
                                placeholder="Enter reason for appointment or patient symptoms..."
                            >{{ appointment.reason or "" }}</textarea>

                        </div>


                        <!-- ==================== BUTTONS ==================== -->
                        <div class="col-12 mt-4">

                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Save Changes
                                </button>


                                <a
                                    href="{{ url_for('appointment.appointment_details', appointment_id=appointment.id) }}"
                                    class="btn btn-secondary"
                                >
                                    Cancel
                                </a>

                            </div>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- ==================== BOOTSTRAP JAVASCRIPT ==================== -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
