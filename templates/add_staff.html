<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Staff - HMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- ==================== NAVBAR ==================== -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container-fluid">

            <a
                href="{{ url_for('dashboard') }}"
                class="navbar-brand"
            >
                Hospital Management System
            </a>

            <a
                href="{{ url_for('staff.staff_list') }}"
                class="btn btn-light btn-sm"
            >
                Staff List
            </a>

        </div>

    </nav>


    <!-- ==================== MAIN CONTENT ==================== -->

    <div class="container mt-4">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4">
                    Add Staff Member
                </h2>


                <form method="POST">

                    <!-- ==================== NAME ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Staff Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter staff name"
                            required
                        >

                    </div>


                    <!-- ==================== ROLE ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Role
                        </label>

                        <select
                            name="role"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Role
                            </option>

                            <option value="Receptionist">
                                Receptionist
                            </option>

                            <option value="Nurse">
                                Nurse
                            </option>

                            <option value="Lab Technician">
                                Lab Technician
                            </option>

                            <option value="Pharmacist">
                                Pharmacist
                            </option>

                            <option value="Accountant">
                                Accountant
                            </option>

                            <option value="Ward Staff">
                                Ward Staff
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- ==================== DEPARTMENT ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <input
                            type="text"
                            name="department"
                            class="form-control"
                            placeholder="e.g. Emergency, Laboratory, Accounts"
                        >

                    </div>


                    <!-- ==================== PHONE ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <!-- ==================== EMAIL ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter email address"
                        >

                    </div>


                    <!-- ==================== ADDRESS ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="3"
                            placeholder="Enter address"
                        ></textarea>

                    </div>


                    <!-- ==================== SALARY ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Salary
                        </label>

                        <input
                            type="number"
                            name="salary"
                            class="form-control"
                            min="0"
                            step="0.01"
                            value="0"
                        >

                    </div>


                    <!-- ==================== JOINING DATE ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            name="joining_date"
                            class="form-control"
                        >

                    </div>


                    <!-- ==================== STATUS ==================== -->

                    <div class="mb-4">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                        >

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                            <option value="On Leave">
                                On Leave
                            </option>

                        </select>

                    </div>


                    <!-- ==================== BUTTONS ==================== -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Staff
                    </button>


                    <a
                        href="{{ url_for('staff.staff_list') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>


    <!-- ==================== BOOTSTRAP JS ==================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
