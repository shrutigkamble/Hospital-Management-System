<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Staff - HMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- ==================== NAVBAR ==================== -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container-fluid">

            <a
                href="{{ url_for('dashboard') }}"
                class="navbar-brand"
            >
                Hospital Management System
            </a>

            <a
                href="{{ url_for('staff.staff_list') }}"
                class="btn btn-light btn-sm"
            >
                Staff List
            </a>

        </div>

    </nav>


    <!-- ==================== MAIN CONTENT ==================== -->

    <div class="container mt-4">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4">
                    Edit Staff Member
                </h2>


                <form method="POST">

                    <!-- ==================== NAME ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Staff Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ staff.name }}"
                            required
                        >

                    </div>


                    <!-- ==================== ROLE ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Role
                        </label>

                        <select
                            name="role"
                            class="form-select"
                            required
                        >

                            <option value="Receptionist"
                                {% if staff.role == "Receptionist" %}selected{% endif %}>
                                Receptionist
                            </option>

                            <option value="Nurse"
                                {% if staff.role == "Nurse" %}selected{% endif %}>
                                Nurse
                            </option>

                            <option value="Lab Technician"
                                {% if staff.role == "Lab Technician" %}selected{% endif %}>
                                Lab Technician
                            </option>

                            <option value="Pharmacist"
                                {% if staff.role == "Pharmacist" %}selected{% endif %}>
                                Pharmacist
                            </option>

                            <option value="Accountant"
                                {% if staff.role == "Accountant" %}selected{% endif %}>
                                Accountant
                            </option>

                            <option value="Ward Staff"
                                {% if staff.role == "Ward Staff" %}selected{% endif %}>
                                Ward Staff
                            </option>

                            <option value="Other"
                                {% if staff.role == "Other" %}selected{% endif %}>
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- ==================== DEPARTMENT ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <input
                            type="text"
                            name="department"
                            class="form-control"
                            value="{{ staff.department or '' }}"
                        >

                    </div>


                    <!-- ==================== PHONE ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ staff.phone }}"
                            required
                        >

                    </div>


                    <!-- ==================== EMAIL ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ staff.email or '' }}"
                        >

                    </div>


                    <!-- ==================== ADDRESS ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="3"
                        >{{ staff.address or '' }}</textarea>

                    </div>


                    <!-- ==================== SALARY ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Salary
                        </label>

                        <input
                            type="number"
                            name="salary"
                            class="form-control"
                            min="0"
                            step="0.01"
                            value="{{ staff.salary or 0 }}"
                        >

                    </div>


                    <!-- ==================== JOINING DATE ==================== -->

                    <div class="mb-3">

                        <label class="form-label">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            name="joining_date"
                            class="form-control"
                            value="{% if staff.joining_date %}{{ staff.joining_date.strftime('%Y-%m-%d') }}{% endif %}"
                        >

                    </div>


                    <!-- ==================== STATUS ==================== -->

                    <div class="mb-4">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                        >

                            <option value="Active"
                                {% if staff.status == "Active" %}selected{% endif %}>
                                Active
                            </option>

                            <option value="Inactive"
                                {% if staff.status == "Inactive" %}selected{% endif %}>
                                Inactive
                            </option>

                            <option value="On Leave"
                                {% if staff.status == "On Leave" %}selected{% endif %}>
                                On Leave
                            </option>

                        </select>

                    </div>


                    <!-- ==================== BUTTONS ==================== -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Staff
                    </button>


                    <a
                        href="{{ url_for('staff.staff_list') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>


    <!-- ==================== BOOTSTRAP JS ==================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
