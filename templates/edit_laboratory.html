<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Laboratory Test - HMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>


<body class="bg-light">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">

        <div class="container-fluid">

            <a
                href="{{ url_for('dashboard') }}"
                class="navbar-brand fw-bold"
            >
                Hospital Management System
            </a>

            <div class="d-flex align-items-center">

                <span class="text-white me-3">
                    Welcome, {{ current_user.username }}
                </span>

                <a
                    href="{{ url_for('logout') }}"
                    class="btn btn-light btn-sm"
                >
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="container mt-4 mb-5">

        <div class="mb-4">

            <h2 class="fw-bold mb-1">
                Edit Laboratory Test
            </h2>

            <p class="text-muted mb-0">
                Update laboratory test, result and report information.
            </p>

        </div>


        <!-- ==================== FORM ==================== -->
        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">
                    Laboratory Test Information
                </h5>

            </div>


            <div class="card-body">

                <form
                    method="POST"
                    action="{{ url_for('laboratory.edit_laboratory_test', test_id=test.id) }}"
                >

                    <div class="row g-3">


                        <!-- Patient -->
                        <div class="col-md-6">

                            <label
                                for="patient_id"
                                class="form-label fw-semibold"
                            >
                                Patient
                            </label>

                            <select
                                name="patient_id"
                                id="patient_id"
                                class="form-select"
                                required
                            >

                                {% for patient in patients %}

                                    <option
                                        value="{{ patient.id }}"
                                        {% if patient.id == test.patient_id %}selected{% endif %}
                                    >

                                        {{ patient.patient_code }}
                                        - {{ patient.name }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Doctor -->
                        <div class="col-md-6">

                            <label
                                for="doctor_id"
                                class="form-label fw-semibold"
                            >
                                Referring Doctor
                            </label>

                            <select
                                name="doctor_id"
                                id="doctor_id"
                                class="form-select"
                            >

                                <option value="">
                                    -- No Doctor Assigned --
                                </option>

                                {% for doctor in doctors %}

                                    <option
                                        value="{{ doctor.id }}"
                                        {% if doctor.id == test.doctor_id %}selected{% endif %}
                                    >

                                        Dr. {{ doctor.name }}
                                        - {{ doctor.specialization }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Test Name -->
                        <div class="col-md-8">

                            <label
                                for="test_name"
                                class="form-label fw-semibold"
                            >
                                Test Name
                            </label>

                            <input
                                type="text"
                                name="test_name"
                                id="test_name"
                                class="form-control"
                                value="{{ test.test_name }}"
                                required
                            >

                        </div>


                        <!-- Test Date -->
                        <div class="col-md-4">

                            <label
                                for="test_date"
                                class="form-label fw-semibold"
                            >
                                Test Date
                            </label>

                            <input
                                type="date"
                                name="test_date"
                                id="test_date"
                                class="form-control"
                                value="{{ test.test_date.strftime('%Y-%m-%d') }}"
                                required
                            >

                        </div>


                        <!-- Status -->
                        <div class="col-md-6">

                            <label
                                for="status"
                                class="form-label fw-semibold"
                            >
                                Status
                            </label>

                            <select
                                name="status"
                                id="status"
                                class="form-select"
                            >

                                <option
                                    value="Requested"
                                    {% if test.status == "Requested" %}selected{% endif %}
                                >
                                    Requested
                                </option>

                                <option
                                    value="In Progress"
                                    {% if test.status == "In Progress" %}selected{% endif %}
                                >
                                    In Progress
                                </option>

                                <option
                                    value="Completed"
                                    {% if test.status == "Completed" %}selected{% endif %}
                                >
                                    Completed
                                </option>

                                <option
                                    value="Cancelled"
                                    {% if test.status == "Cancelled" %}selected{% endif %}
                                >
                                    Cancelled
                                </option>

                            </select>

                        </div>


                        <!-- Result -->
                        <div class="col-md-6">

                            <label
                                for="result"
                                class="form-label fw-semibold"
                            >
                                Result
                            </label>

                            <input
                                type="text"
                                name="result"
                                id="result"
                                class="form-control"
                                value="{{ test.result or '' }}"
                                placeholder="Enter test result"
                            >

                        </div>


                        <!-- Report -->
                        <div class="col-12">

                            <label
                                for="report"
                                class="form-label fw-semibold"
                            >
                                Laboratory Report
                            </label>

                            <textarea
                                name="report"
                                id="report"
                                class="form-control"
                                rows="5"
                                placeholder="Enter detailed laboratory report..."
                            >{{ test.report or '' }}</textarea>

                        </div>


                        <!-- Remarks -->
                        <div class="col-12">

                            <label
                                for="remarks"
                                class="form-label fw-semibold"
                            >
                                Remarks
                            </label>

                            <textarea
                                name="remarks"
                                id="remarks"
                                class="form-control"
                                rows="3"
                                placeholder="Enter additional remarks..."
                            >{{ test.remarks or '' }}</textarea>

                        </div>


                        <!-- Buttons -->
                        <div class="col-12 mt-4">

                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Save Changes
                                </button>

                                <a
                                    href="{{ url_for('laboratory.laboratory_details', test_id=test.id) }}"
                                    class="btn btn-secondary"
                                >
                                    Cancel
                                </a>

                            </div>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
