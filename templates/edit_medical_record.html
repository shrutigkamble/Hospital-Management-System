<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Medical Record - HMS</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>


<body class="bg-light">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">

        <div class="container-fluid">

            <a
                href="{{ url_for('dashboard') }}"
                class="navbar-brand fw-bold"
            >
                Hospital Management System
            </a>


            <div class="d-flex align-items-center">

                <span class="text-white me-3">
                    Welcome, {{ current_user.username }}
                </span>

                <a
                    href="{{ url_for('logout') }}"
                    class="btn btn-light btn-sm"
                >
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="container mt-4 mb-5">

        <!-- Page Header -->
        <div class="mb-4">

            <h2 class="fw-bold mb-1">
                Edit Medical Record
            </h2>

            <p class="text-muted mb-0">
                Update patient diagnosis, treatment and medical information
            </p>

        </div>


        <!-- ==================== EDIT FORM ==================== -->
        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">
                    Medical Record Information
                </h5>

            </div>


            <div class="card-body">

                <form
                    method="POST"
                    action="{{ url_for('medical_record.edit_medical_record', record_id=record.id) }}"
                >

                    <div class="row g-3">


                        <!-- ==================== PATIENT ==================== -->
                        <div class="col-md-6">

                            <label
                                for="patient_id"
                                class="form-label fw-semibold"
                            >
                                Patient
                            </label>

                            <select
                                name="patient_id"
                                id="patient_id"
                                class="form-select"
                                required
                            >

                                {% for patient_item in patients %}

                                    <option
                                        value="{{ patient_item.id }}"
                                        {% if patient_item.id == record.patient_id %}selected{% endif %}
                                    >

                                        {{ patient_item.patient_code }}
                                        - {{ patient_item.name }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- ==================== DOCTOR ==================== -->
                        <div class="col-md-6">

                            <label
                                for="doctor_id"
                                class="form-label fw-semibold"
                            >
                                Doctor
                            </label>

                            <select
                                name="doctor_id"
                                id="doctor_id"
                                class="form-select"
                                required
                            >

                                {% for doctor_item in doctors %}

                                    <option
                                        value="{{ doctor_item.id }}"
                                        {% if doctor_item.id == record.doctor_id %}selected{% endif %}
                                    >

                                        Dr. {{ doctor_item.name }}
                                        - {{ doctor_item.specialization }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- ==================== APPOINTMENT ==================== -->
                        <div class="col-md-6">

                            <label
                                for="appointment_id"
                                class="form-label fw-semibold"
                            >
                                Related Appointment
                            </label>

                            <select
                                name="appointment_id"
                                id="appointment_id"
                                class="form-select"
                            >

                                <option value="">
                                    -- None / Not Linked --
                                </option>

                                {% for appointment in appointments %}

                                    <option
                                        value="{{ appointment.id }}"
                                        {% if appointment.id == record.appointment_id %}selected{% endif %}
                                    >

                                        Appointment #{{ appointment.id }}
                                        -
                                        {{ appointment.appointment_date.strftime("%d-%m-%Y") }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- ==================== DIAGNOSIS ==================== -->
                        <div class="col-12">

                            <label
                                for="diagnosis"
                                class="form-label fw-semibold"
                            >
                                Diagnosis
                            </label>

                            <textarea
                                name="diagnosis"
                                id="diagnosis"
                                class="form-control"
                                rows="3"
                                placeholder="Enter patient diagnosis..."
                            >{{ record.diagnosis or "" }}</textarea>

                        </div>


                        <!-- ==================== TREATMENT ==================== -->
                        <div class="col-12">

                            <label
                                for="treatment"
                                class="form-label fw-semibold"
                            >
                                Treatment
                            </label>

                            <textarea
                                name="treatment"
                                id="treatment"
                                class="form-control"
                                rows="3"
                                placeholder="Enter treatment details..."
                            >{{ record.treatment or "" }}</textarea>

                        </div>


                        <!-- ==================== PRESCRIPTION ==================== -->
                        <div class="col-12">

                            <label
                                for="prescription"
                                class="form-label fw-semibold"
                            >
                                Prescription
                            </label>

                            <textarea
                                name="prescription"
                                id="prescription"
                                class="form-control"
                                rows="3"
                                placeholder="Enter prescribed medicines and instructions..."
                            >{{ record.prescription or "" }}</textarea>

                        </div>


                        <!-- ==================== ALLERGIES ==================== -->
                        <div class="col-md-6">

                            <label
                                for="allergies"
                                class="form-label fw-semibold"
                            >
                                Allergies
                            </label>

                            <textarea
                                name="allergies"
                                id="allergies"
                                class="form-control"
                                rows="3"
                                placeholder="Enter known allergies..."
                            >{{ record.allergies or "" }}</textarea>

                        </div>


                        <!-- ==================== MEDICAL REPORT ==================== -->
                        <div class="col-md-6">

                            <label
                                for="medical_report"
                                class="form-label fw-semibold"
                            >
                                Medical Report
                            </label>

                            <textarea
                                name="medical_report"
                                id="medical_report"
                                class="form-control"
                                rows="3"
                                placeholder="Enter medical report details..."
                            >{{ record.medical_report or "" }}</textarea>

                        </div>


                        <!-- ==================== BUTTONS ==================== -->
                        <div class="col-12 mt-4">

                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Save Changes
                                </button>


                                <a
                                    href="{{ url_for('medical_record.medical_record_details', record_id=record.id) }}"
                                    class="btn btn-secondary"
                                >
                                    Cancel
                                </a>

                            </div>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- ==================== BOOTSTRAP JAVASCRIPT ==================== -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
