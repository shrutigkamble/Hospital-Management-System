<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied - Hospital Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            max-width: 550px;
            width: 90%;
            background: white;
            border-radius: 18px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 80px;
            font-weight: 700;
            color: #dc3545;
            line-height: 1;
            margin-bottom: 15px;
        }

        .error-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .error-message {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .btn-home {
            padding: 10px 25px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="error-card">

        <div class="error-code">
            403
        </div>

        <h1 class="error-title">
            Access Denied
        </h1>

        <p class="error-message">
            You do not have permission to access this page.
            Please contact the administrator if you believe this is an error.
        </p>

        <a
            href="{{ url_for('login') }}"
            class="btn btn-primary btn-home"
        >
            Back to Login
        </a>

    </div>

</body>
</html>
